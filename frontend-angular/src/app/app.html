<div style="max-width: 500px; margin: 40px auto; font-family: Arial, sans-serif; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Cadastro de Entregas (MIDC)</h2>

  <div *ngIf="mensagemSucesso" style="background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
    {{ mensagemSucesso }}
  </div>

  <div *ngIf="mensagemErro" style="background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
    {{ mensagemErro }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label>Nome do Funcionário:</label><br>
      <input type="text" formControlName="nome" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Departamento:</label><br>
      <input type="text" formControlName="departamento" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Data de Referência:</label><br>
      <input type="date" formControlName="data_referencia" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Quantidade de Entregas:</label><br>
      <input type="number" formControlName="quantidade_entregas" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Observação:</label><br>
      <textarea formControlName="observacao" style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
      Cadastrar Registro
    </button>
  </form>
</div>
